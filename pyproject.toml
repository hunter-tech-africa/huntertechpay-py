[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huntertechpay"
version = "1.0.0"
authors = [
  { name="HunterTechPay", email="support@huntertechpay.com" },
]
description = "Official Python SDK for HunterTechPay mobile money API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0",
]

[project.urls]
"Homepage" = "https://huntertechpay.com/merchant-api/documentation"
"Bug Tracker" = "https://github.com/hunter-tech-africa/huntertechpay-py/issues"
"Source Code" = "https://github.com/hunter-tech-africa/huntertechpay-py"